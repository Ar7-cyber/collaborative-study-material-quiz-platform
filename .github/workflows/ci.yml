name: CSQP Full CI/CD Pipeline

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  # ============================================================================
  # Continuous Integration (CI) - Lint, Dependency Audit & Automated Test Suites
  # ============================================================================
  lint_and_security:
    name: Code Quality & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js Runtime (v20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Project Dependencies
        run: npm ci

      - name: Verify Syntactic Integrity of Services & Routes
        run: |
          node -c server.js
          node -c services/authService.js
          node -c services/materialService.js
          node -c services/versionService.js
          node -c services/quizService.js
          node -c services/adminService.js
          node -c routes/authRoutes.js
          node -c routes/materialRoutes.js
          node -c routes/quizRoutes.js
          node -c routes/adminRoutes.js

  test_suite:
    name: Automated Unit & Integration Tests (22 Suites)
    runs-on: ubuntu-latest
    needs: lint_and_security
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run All Automated Test Suites
        run: npm test

  # ============================================================================
  # Continuous Delivery & Deployment (CD) - Production Staging & Artifact Build
  # ============================================================================
  build_and_package:
    name: Package Release Artifact
    runs-on: ubuntu-latest
    needs: test_suite
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Production Dependencies Only
        run: npm ci --omit=dev

      - name: Prepare Clean Application Artifact Bundle
        run: |
          mkdir -p build/csqp-release
          cp -r server.js package.json package-lock.json db/ routes/ services/ public/ docs/ build/csqp-release/
          cd build && tar -czf csqp-release-v1.0.tar.gz csqp-release/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: csqp-production-bundle
          path: build/csqp-release-v1.0.tar.gz
          retention-days: 14

  deploy_staging:
    name: Deploy to Staging Verification Environment
    runs-on: ubuntu-latest
    needs: build_and_package
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Download Packaged Artifact
        uses: actions/download-artifact@v4
        with:
          name: csqp-production-bundle

      - name: Extract Staging Bundle
        run: |
          tar -xzf csqp-release-v1.0.tar.gz
          cd csqp-release
          ls -la

      - name: Verify Staging Boot Check
        run: |
          cd csqp-release
          PORT=3001 NODE_ENV=test node server.js &
          PID=$!
          sleep 3
          curl -I http://localhost:3001 || exit 1
          kill $PID
          echo "CSQP Staging Deployment Health Check Passed Successfully!"
